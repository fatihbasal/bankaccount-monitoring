<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bütçe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bütçe</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#14201d;--muted:#667570;--line:#e2e8e5;--accent:#0f766e;--accent-t:#fff;--good:#15803d;--bad:#b91c1c;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--card:#17211e;--text:#e8efec;--muted:#8fa19b;--line:#27352f;--accent:#2dd4bf;--accent-t:#06201b;--good:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
h2{font-size:18px;margin:0}
h3{font-size:13px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:10px;border:1px solid var(--line);border-radius:10px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:17px}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-t);font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.icon{background:transparent;color:var(--muted);padding:4px 10px;font-size:20px}
button.full{width:100%;margin-top:12px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--bad)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item small{color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:transparent;color:var(--muted);border-radius:0;padding:12px 4px;font-size:12px;font-weight:600}
nav button.on{color:var(--accent)}
nav button span{display:block;font-size:20px}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button data-tab="ozet"><span>📊</span>Özet</button>
  <button data-tab="gider"><span>🧾</span>Harcamalar</button>
  <button data-tab="kart"><span>💳</span>Kartlar</button>
  <button data-tab="varlik"><span>🏦</span>Varlığım</button>
  <button data-tab="hedef"><span>🎯</span>Hedef</button>
</nav>
<script>
const KEY = 'butce-v1';
const CATS = ['Market', 'Fatura', 'Kira', 'Ulaşım', 'Yeme-İçme', 'Eğlence', 'Sağlık', 'Giyim', 'Diğer'];
const MN = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

const def = () => ({ months: {}, cards: [], goal: { amount: 0, month: '', saved: 0 }, simSpend: null, rates: { USD: 0, EUR: 0, at: '' }, cur: { salary: 'TRY', cards: 'TRY', goal: 'TRY' }, assets: [], pricesAt: '', payments: [] });
function load() {
  try {
    const d = Object.assign(def(), JSON.parse(localStorage.getItem(KEY)));
    d.cur = Object.assign(def().cur, d.cur);
    // Eski sürümde aya özel olan para birimini tek maaş birimine taşı.
    for (const k in d.months) { const c = d.months[k].cur; if (c && c !== 'TRY') d.cur.salary = c; delete d.months[k].cur; }
    return d;
  } catch (e) { return def(); }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
let S = load();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round((n || 0) * 100) / 100).toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';
// "1.250,50" ve "1250,5" TR biçimi; virgülsüz "0.01" ondalık, "1.250" ve "1.250.000" binlik sayılır.
const num = v => {
  let s = String(v).trim().replace(/\s/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /^[1-9]\d{0,2}\.\d{3}$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const raw = n => (n ? String(n).replace('.', ',') : '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const pad = n => String(n).padStart(2, '0');
const ymNow = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const today = () => { const d = new Date(); return ymNow() + '-' + pad(d.getDate()); };
function shift(m, k) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function diff(a, b) { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); }
const label = m => { const [y, mo] = m.split('-'); return MN[mo - 1] + ' ' + y; };

const getM = m => S.months[m] || { salary: null, expenses: [] };
const ensureM = m => S.months[m] || (S.months[m] = { salary: null, expenses: [] });
const spent = m => getM(m).expenses.reduce((a, e) => a + e.amount, 0);

// Ayın kasası: maaşla başlar; karta/varlığa yazılmayan harcamalar ve "bu ayın parasından" ödenen kart borçları düşer.
const monthOut = m => getM(m).expenses.filter(e => !e.cardId && !e.assetId).reduce((a, e) => a + e.amount, 0)
  + S.payments.filter(p => p.month === m && p.src === 'month').reduce((a, p) => a + p.tl, 0);
const remaining = m => salaryFor(m) - monthOut(m);
const hasActivity = m => { const x = S.months[m]; return !!(x && (x.salary != null || x.expenses.length)) || S.payments.some(p => p.month === m); };
function openMonths() {
  const now = ymNow(), ks = new Set(Object.keys(S.months));
  S.payments.forEach(p => ks.add(p.month)); ks.add(now);
  return [...ks].filter(m => m <= now && (m === now || hasActivity(m)) && !getM(m).closed).sort();
}
const openRemainder = () => openMonths().reduce((s, m) => s + remaining(m), 0);
// Varlıktan TL tutar düşer; yetersizse null döner. Düşülen miktarı (adet/gram/tutar) verir.
function takeFromAsset(a, tl) {
  const u = a.price * rateOf(a.cur);
  if (!u) return null;
  const q = tl / u;
  if (q > a.qty + 1e-9) return null;
  a.qty -= q;
  return q;
}
const payOpts = withCards => '<option value="">Bu ayın parası</option>'
  + (withCards ? S.cards.map(c => `<option value="c:${c.id}">💳 ${esc(c.name)}</option>`).join('') : '')
  + S.assets.filter(a => a.type !== 'other' && a.qty > 0).map(a => `<option value="a:${a.id}">🏦 ${esc(a.name)}</option>`).join('');
const CURS = ['TRY', 'USD', 'EUR'];
const SYM = { TRY: '₺', USD: '$', EUR: '€' };
const rateOf = c => (!c || c === 'TRY') ? 1 : (S.rates[c] || 0);
function salaryRef(m) {
  const keys = Object.keys(S.months).filter(k => k <= m && S.months[k].salary != null).sort();
  return keys.length ? S.months[keys[keys.length - 1]] : null;
}
// Maaş, kartlar ve hedef kendi tek para birimini taşır (S.cur); hesaplar TL üzerinden yapılır.
function salaryFor(m) { const r = salaryRef(m); return r ? r.salary * rateOf(S.cur.salary) : 0; }
const fmtC = (n, c) => c === 'TRY' ? fmt(n) : (Math.round((n || 0) * 100) / 100).toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ' + SYM[c];
const curSel = k => `<select data-cur="${k}">${CURS.map(c => `<option ${c === S.cur[k] ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
const noRate = k => S.cur[k] !== 'TRY' && !rateOf(S.cur[k]) ? `<div class="neg" style="margin-top:6px">Kur girilmedi. Özet sayfasındaki Döviz kuru bölümünden gir.</div>` : '';
function cardDebt(c) {
  let d = c.base || 0;
  const r = rateOf(S.cur.cards) || 1;
  for (const k in S.months) for (const e of S.months[k].expenses) if (e.cardId === c.id) d += e.amount / r;
  for (const p of S.payments) if (p.cardId === c.id) d -= p.amt;
  return d;
}
function goalInfo() {
  const g = S.goal;
  const gr = rateOf(S.cur.goal);
  if (!g.amount || !g.month || !gr) return null;
  const now = ymNow();
  const n = diff(now, g.month) + 1;
  const need = Math.max(0, (g.amount - g.saved) * gr);
  if (n < 1) return { expired: true, need };
  return { n, need, per: need / n };
}

let M = ymNow(), TAB = 'ozet';

function vOzet() {
  const m = getM(M), sal = m.salary || 0, sp = spent(M);
  const debt = S.cards.reduce((a, c) => a + cardDebt(c), 0) * rateOf(S.cur.cards);
  const gi = goalInfo();
  const rem = remaining(M), cl = m.closed;
  const old = openMonths().filter(x => x < ymNow() && x !== M);
  const banner = old.length ? `<div class="card"><h3>Kapatılmamış aylar</h3>${old.map(x => `<div class="item"><span>${label(x)} · kalan ${fmt(remaining(x))}</span><button class="ghost" data-act="goMonth" data-m="${x}">Aç</button></div>`).join('')}</div>` : '';
  const closeBlock = M > ymNow() ? '' : cl
    ? `<div class="card"><h3>Ay kapandı</h3><div>${fmt(cl.amt)} varlıklara nakit olarak eklendi.</div><button class="ghost full" data-act="undoClose">Kapanışı geri al</button></div>`
    : `<div class="card"><h3>Ay sonu</h3><div class="muted">Kalan nakit (${fmt(rem)}) Varlığım'a "Aylık artan nakit" olarak eklenir. Sonraki ay maaşla sıfırdan başlar.</div><button class="full" data-act="closeMonth">Ayı kapat</button></div>`;
  let goalBlock = '';
  if (gi && !gi.expired) {
    const cap = salaryFor(M) - gi.per;
    const pct = cap > 0 ? Math.min(100, sp / cap * 100) : 100;
    goalBlock = `<div class="card"><h3>Hedefe göre harcama limiti</h3>
      <div class="row"><b>${cap > 0 ? fmt(cap) : '—'}</b><span class="muted">${fmt(gi.per)} / ay birikim</span></div>
      <div class="bar"><i class="${sp > cap ? 'over' : ''}" style="width:${pct}%"></i></div>
      <div class="muted">${cap <= 0 ? 'Bu maaşla hedefe ulaşılamıyor. Hedefi veya tarihi gözden geçir.'
        : sp > cap ? `<span class="neg">Limiti ${fmt(sp - cap)} aştın.</span>` : `<span class="pos">${fmt(cap - sp)} harcama hakkın kaldı.</span>`}</div></div>`;
  } else if (gi && gi.expired) {
    goalBlock = `<div class="card"><h3>Hedef</h3><div class="muted">Hedef tarihi geçmiş. Hedef sekmesinden güncelle.</div></div>`;
  }
  return `<div class="card">
    <div class="row"><button class="icon" data-act="prev">‹</button><h2>${label(M)}</h2><button class="icon" data-act="next">›</button></div>
    <label>Aylık maaş / gelir</label>
    <div class="grid" style="grid-template-columns:2fr 1fr">
      <input inputmode="decimal" data-set="salary" value="${raw(m.salary)}" placeholder="${salaryRef(M) ? raw(salaryRef(M).salary) + ' (önceki aydan)' : '0'}">
      ${curSel('salary')}
    </div>
    ${noRate('salary')}
    ${S.cur.salary !== 'TRY' && rateOf(S.cur.salary) ? `<div class="muted" style="margin-top:6px">≈ ${fmt(salaryFor(M))} (1 ${SYM[S.cur.salary]} = ${raw(rateOf(S.cur.salary))} ₺) · para birimi tüm aylar için geçerli</div>` : ''}
  </div>
  <div class="card"><h3>Döviz kuru</h3>
    <div class="grid">
      <div><label>1 $ = ₺</label><input inputmode="decimal" data-rate="USD" value="${raw(S.rates.USD)}" placeholder="0"></div>
      <div><label>1 € = ₺</label><input inputmode="decimal" data-rate="EUR" value="${raw(S.rates.EUR)}" placeholder="0"></div>
    </div>
    <button class="ghost full" data-act="fetchRates">İnternetten güncelle</button>
    <div class="muted" style="margin-top:6px">${S.rates.at ? 'Son güncelleme: ' + S.rates.at.split('-').reverse().join('.') : 'Kuru elle girebilir veya internetten çekebilirsin.'}</div>
  </div>
  <div class="grid" style="margin-bottom:12px">
    <div class="stat"><small>Gelir</small><b>${fmt(salaryFor(M))}</b></div>
    <div class="stat"><small>Harcama</small><b>${fmt(sp)}</b></div>
    <div class="stat"><small>Nakit kalan</small><b class="${rem < 0 ? 'neg' : 'pos'}">${fmt(rem)}</b></div>
    <div class="stat"><small>Toplam kart borcu</small><b class="${debt > 0 ? 'warn' : ''}">${fmt(debt)}</b></div>
  </div>
  <div class="muted" style="margin:-4px 0 12px">Nakit kalan = gelir − nakit harcamalar − bu aydan ödenen kart borçları. Karta yapılan harcama, borç ödenince düşer.</div>
  ${banner}${closeBlock}${goalBlock}
  <div class="card"><h3>Yedek</h3>
    <div class="muted" style="margin-bottom:10px">Veriler sadece bu telefonda saklanır. Ara sıra yedek al.</div>
    <div class="row"><button class="ghost" data-act="export" style="flex:1">Dışa aktar</button>
    <button class="ghost" data-act="import" style="flex:1">İçe aktar</button></div>
    <input type="file" id="file" accept="application/json" hidden>
  </div>`;
}

function vGider() {
  const list = getM(M).expenses.slice().sort((a, b) => b.date.localeCompare(a.date));
  const dd = today().startsWith(M) ? today() : M + '-01';
  const byCat = {};
  list.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + e.amount);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  return `<div class="card">
    <div class="row"><button class="icon" data-act="prev">‹</button><h2>${label(M)}</h2><button class="icon" data-act="next">›</button></div>
    <label>Açıklama</label><input id="f-desc" placeholder="Örn. Migros">
    <div class="grid">
      <div><label>Tutar</label><input id="f-amt" inputmode="decimal" placeholder="0"></div>
      <div><label>Tarih</label><input id="f-date" type="date" value="${dd}"></div>
    </div>
    <div class="grid">
      <div><label>Kategori</label><select id="f-cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div><label>Ödeme</label><select id="f-card">${payOpts(true)}</select></div>
    </div>
    <button class="full" data-act="addExp">Harcama ekle</button>
  </div>
  ${cats.length ? `<div class="card"><h3>Kategoriler</h3>${cats.map(([c, v]) => `<div class="item"><span>${c}</span><b>${fmt(v)}</b></div>`).join('')}</div>` : ''}
  <div class="card"><h3>Harcamalar · ${fmt(spent(M))}</h3>
    ${list.length ? list.map(e => {
      const c = S.cards.find(x => x.id === e.cardId), ast = S.assets.find(x => x.id === e.assetId);
      return `<div class="item"><div><div>${esc(e.desc || e.cat)}</div><small>${e.date.slice(8)}.${e.date.slice(5, 7)} · ${e.cat}${c ? ' · 💳 ' + esc(c.name) : ast ? ' · 🏦 ' + esc(ast.name) : ''}</small></div>
      <div style="text-align:right"><b>${fmt(e.amount)}</b><br><button class="icon" style="font-size:14px;padding:0" data-act="delExp" data-id="${e.id}">sil</button></div></div>`;
    }).join('') : '<div class="muted">Bu ay henüz harcama yok.</div>'}
  </div>`;
}

function vKart() {
  return `<div class="card"><div class="row"><h3 style="margin:0">Kart para birimi</h3><div style="width:110px">${curSel('cards')}</div></div>
    ${noRate('cards')}<div class="muted" style="margin-top:6px">Tüm kartlar için geçerli. Harcamalar TL girilir, borca kurla çevrilerek eklenir.</div></div>
  ${S.cards.map(c => {
    const d = cardDebt(c), pct = c.limit ? Math.min(100, d / c.limit * 100) : 0;
    return `<div class="card"><div class="row"><input data-card="${c.id}" data-field="name" value="${esc(c.name)}" style="font-weight:700"><button class="icon" data-act="delCard" data-id="${c.id}">🗑</button></div>
      <div class="grid">
        <div><label>Limit</label><input inputmode="decimal" data-card="${c.id}" data-field="limit" value="${raw(c.limit)}"></div>
        <div><label>Devreden borç</label><input inputmode="decimal" data-card="${c.id}" data-field="base" value="${raw(c.base)}"></div>
      </div>
      <div class="bar"><i class="${pct > 80 ? 'over' : ''}" style="width:${pct}%"></i></div>
      <div class="row"><span class="muted">Güncel borç</span><b class="${d > 0 ? 'warn' : ''}">${fmtC(d, S.cur.cards)}</b></div>
      <div class="row"><span class="muted">Kullanılabilir limit</span><b>${fmtC(Math.max(0, c.limit - d), S.cur.cards)}</b></div>
      <div class="muted" style="margin-top:6px">Harcama eklerken bu kartı seçersen borca otomatik eklenir.</div>
      <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:2px"><label>Borç öde · ${label(M)} ayına yazılır</label>
        <div class="grid"><input id="p-amt-${c.id}" inputmode="decimal" placeholder="Tutar (${SYM[S.cur.cards]})"><select id="p-src-${c.id}">${payOpts(false)}</select></div>
        <button class="full" data-act="payCard" data-id="${c.id}">Öde</button>
        ${S.payments.filter(p => p.cardId === c.id).slice(-3).reverse().map(p => {
          const ast = S.assets.find(x => x.id === p.src);
          return `<div class="item"><small>${p.date.slice(8)}.${p.date.slice(5, 7)} · ${p.src === 'month' ? 'bu ayın parası' : ast ? esc(ast.name) : 'varlık'}</small><span>${fmtC(p.amt, S.cur.cards)} <button class="icon" style="font-size:14px;padding:0 6px" data-act="delPay" data-id="${p.id}">sil</button></span></div>`;
        }).join('')}</div></div>`;
  }).join('')}
  <div class="card"><h3>Yeni kart</h3>
    <label>Kart adı</label><input id="c-name" placeholder="Örn. Garanti Bonus">
    <div class="grid">
      <div><label>Limit</label><input id="c-limit" inputmode="decimal" placeholder="0"></div>
      <div><label>Mevcut borç</label><input id="c-base" inputmode="decimal" placeholder="0"></div>
    </div>
    <button class="full" data-act="addCard">Kart ekle</button></div>`;
}

const TYPES = { cash: 'Nakit / Mevduat', gold: 'Altın', silver: 'Gümüş', stock: 'Hisse', crypto: 'Kripto', other: 'Diğer' };
const COINS = [['bitcoin', 'Bitcoin'], ['ethereum', 'Ethereum'], ['solana', 'Solana'], ['ripple', 'XRP'], ['binancecoin', 'BNB'], ['dogecoin', 'Dogecoin']];
const AUTO = { gold: 1, silver: 1, crypto: 1 }; // fiyatı internetten gelenler
const assetVal = a => a.qty * a.price * rateOf(a.cur);
const isAuto = a => AUTO[a.type] || (a.type === 'stock' && a.us && S.finnhubKey);
let NEWTYPE = 'gold';

function fAdd() {
  const T = NEWTYPE;
  const curS = `<select id="a-cur">${CURS.map(c => `<option>${c}</option>`).join('')}</select>`;
  let f;
  if (T === 'cash') f = `<label>Ad</label><input id="a-name" placeholder="Örn. Vadesiz hesap"><div class="grid"><div><label>Tutar</label><input id="a-qty" inputmode="decimal" placeholder="0"></div><div><label>Para birimi</label>${curS}</div></div>`;
  else if (T === 'gold' || T === 'silver') f = `<label>Miktar (gram)</label><input id="a-qty" inputmode="decimal" placeholder="0">`;
  else if (T === 'crypto') f = `<label>Coin</label><select id="a-coin">${COINS.map(([id, n]) => `<option value="${id}">${n}</option>`).join('')}</select><label>Adet</label><input id="a-qty" inputmode="decimal" placeholder="0">`;
  else if (T === 'stock') f = `<label>Sembol</label><input id="a-name" placeholder="AAPL, THYAO…" autocapitalize="characters">
    <label>Piyasa</label><select id="a-mkt"><option value="us">ABD (fiyat otomatik, dolar)</option><option value="man">BIST / diğer (fiyatı elle gir)</option></select>
    <div class="grid"><div><label>Adet</label><input id="a-qty" inputmode="decimal" placeholder="0"></div><div><label>Birim fiyat (elle girilecekse)</label><input id="a-price" inputmode="decimal" placeholder="0"></div></div><label>Para birimi (elle girilen fiyat için)</label>${curS}`;
  else f = `<label>Ad</label><input id="a-name" placeholder="Örn. Araba"><div class="grid"><div><label>Değer</label><input id="a-price" inputmode="decimal" placeholder="0"></div><div><label>Para birimi</label>${curS}</div></div>`;
  return `<div class="card"><h3>Varlık ekle</h3><label>Tür</label><select id="a-type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === T ? 'selected' : ''}>${v}</option>`).join('')}</select>${f}<button class="full" data-act="addAsset">Ekle</button></div>`;
}

function vVarlik() {
  const total = S.assets.reduce((s, a) => s + assetVal(a), 0);
  const debt = S.cards.reduce((s, c) => s + cardDebt(c), 0) * rateOf(S.cur.cards);
  const open = openRemainder();
  const net = total + open - debt;
  const byType = {};
  S.assets.forEach(a => byType[a.type] = (byType[a.type] || 0) + assetVal(a));
  const missing = S.assets.some(a => a.cur !== 'TRY' && !rateOf(a.cur));
  const unit = { gold: 'Miktar (gram)', silver: 'Miktar (gram)', cash: 'Tutar', crypto: 'Adet', stock: 'Adet' };
  const row = a => {
    const cs = `<select data-asset="${a.id}" data-field="cur">${CURS.map(c => `<option ${c === a.cur ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
    const q = `<div><label>${unit[a.type]}</label><input inputmode="decimal" data-asset="${a.id}" data-field="qty" value="${raw(a.qty)}"></div>`;
    const p = `<div><label>${a.type === 'other' ? 'Değer' : 'Birim fiyat'}${isAuto(a) ? ` (${SYM[a.cur]}, otomatik)` : ''}</label><input inputmode="decimal" data-asset="${a.id}" data-field="price" value="${raw(a.price)}"></div>`;
    const c = `<div><label>Para birimi</label>${cs}</div>`;
    const fields = a.type === 'cash' ? q + c : a.type === 'other' ? p + c : isAuto(a) ? q + p : q + p + `<div style="grid-column:span 2">${c}</div>`;
    return `<div class="card"><div class="row"><div><b>${esc(a.name)}</b><br><small class="muted">${TYPES[a.type]}${a.at ? ' · fiyat ' + a.at.split('-').reverse().join('.') : ''}</small></div>
      <button class="icon" data-act="delAsset" data-id="${a.id}">🗑</button></div>
      <div class="grid">${fields}</div>
      <div class="row" style="margin-top:10px"><span class="muted">Değeri</span><b>${fmt(assetVal(a))}</b></div></div>`;
  };
  return `<div class="card"><h3>Net varlık</h3>
    <div style="font-size:28px;font-weight:700" class="${net < 0 ? 'neg' : 'pos'}">${fmt(net)}</div>
    <div class="grid" style="margin-top:12px">
      <div class="stat"><small>Toplam varlık</small><b>${fmt(total)}</b></div>
      <div class="stat"><small>Kapanmamış ayların nakdi</small><b class="${open < 0 ? 'neg' : ''}">${fmt(open)}</b></div>
      <div class="stat"><small>Kart borcu</small><b class="${debt > 0 ? 'warn' : ''}">${fmt(debt)}</b></div>
    </div>
    <div class="muted" style="margin-top:8px">Net varlık = toplam varlık + kapanmamış ayların nakdi − kart borcu</div>
    ${missing ? '<div class="neg" style="margin-top:8px">Bazı varlıkların kuru girilmedi, değerleri 0 sayılıyor. Özet sayfasından kuru gir.</div>' : ''}
  </div>
  ${total > 0 ? `<div class="card"><h3>Dağılım</h3>${Object.entries(byType).sort((x, y) => y[1] - x[1]).map(([t, v]) => `
    <div style="margin-bottom:8px"><div class="row"><span>${TYPES[t]}</span><b>${fmt(v)} · %${Math.round(v / total * 100)}</b></div>
    <div class="bar"><i style="width:${v / total * 100}%"></i></div></div>`).join('')}</div>` : ''}
  <div class="card"><button class="ghost" style="width:100%" data-act="refreshAll">Fiyatları güncelle</button>
    <div class="muted" style="margin-top:6px">${S.pricesAt ? 'Son güncelleme: ' + S.pricesAt.split('-').reverse().join('.') + '. ' : ''}Altın, gümüş ve kripto fiyatı otomatik gelir. ABD hisseleri aşağıdaki Finnhub anahtarıyla gelir. BIST ve diğer varlıkların fiyatını sen girersin.</div></div>
  <div class="card"><h3>ABD hisseleri için Finnhub anahtarı</h3>
    <input data-key="finnhub" value="${esc(S.finnhubKey || '')}" placeholder="API anahtarı" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="muted" style="margin-top:6px">finnhub.io'dan ücretsiz alınır. Anahtar sadece bu telefonda saklanır, yedek dosyasına yazılmaz.</div></div>
  ${S.assets.map(row).join('')}
  ${fAdd()}`;
}

function vHedef() {
  const g = S.goal, gi = goalInfo(), now = ymNow(), sal = salaryFor(now);
  let plan = '<div class="muted">Hedef tutarı ve tarihi gir.</div>';
  if (gi && gi.expired) plan = '<div class="neg">Hedef tarihi geçmiş.</div>';
  else if (gi) {
    const cap = sal - gi.per;
    plan = `<div class="grid">
      <div class="stat"><small>Kalan miktar</small><b>${fmt(gi.need)}</b></div>
      <div class="stat"><small>Kalan ay</small><b>${gi.n}</b></div>
      <div class="stat"><small>Aylık birikim</small><b>${fmt(gi.per)}</b></div>
      <div class="stat"><small>Aylık harcama limiti</small><b class="${cap < 0 ? 'neg' : 'pos'}">${fmt(cap)}</b></div></div>
      ${cap < 0 ? '<div class="neg" style="margin-top:10px">Mevcut maaşla bu hedefe ulaşmak mümkün değil.</div>' : ''}`;
  }
  const simDef = S.simSpend != null ? S.simSpend : (gi && !gi.expired ? Math.max(0, Math.round(sal - gi.per)) : 0);
  return `<div class="card"><div class="row"><h3 style="margin:0">Birikim hedefi</h3><div style="width:110px">${curSel('goal')}</div></div>
    ${noRate('goal')}
    <label>Hedef tutar</label><input inputmode="decimal" data-goal="amount" value="${raw(g.amount)}" placeholder="0">
    <label>Hedef ay</label><input type="month" data-goal="month" value="${g.month}">
    <label>Şu ana kadar biriken</label><input inputmode="decimal" data-goal="saved" value="${raw(g.saved)}" placeholder="0">
  </div>
  <div class="card"><h3>Plan</h3>${plan}
    <div class="muted" style="margin-top:8px">Hesapta ${label(now)} maaşın: ${fmt(sal)}</div></div>
  <div class="card"><h3>Ya şu kadar harcarsam?</h3>
    <label>Aylık harcama</label><input id="simin" inputmode="decimal" value="${raw(simDef)}">
    <div id="simout" style="margin-top:12px"></div></div>`;
}

function sim() {
  const out = $('#simout'); if (!out) return;
  const spend = num($('#simin').value);
  S.simSpend = spend; persist();
  const now = ymNow(), sal = salaryFor(now), sv = sal - spend, gi = goalInfo(), gr = rateOf(S.cur.goal);
  const g = { amount: S.goal.amount * gr, saved: S.goal.saved * gr, month: S.goal.month }; // TL karşılığı
  let h = `<div class="stat"><small>Aylık birikim</small><b class="${sv < 0 ? 'neg' : 'pos'}">${fmt(sv)}</b></div>`;
  if (gi && !gi.expired) {
    const proj = g.saved + sv * gi.n;
    h += `<div class="stat" style="margin-top:8px"><small>${label(g.month)} sonunda birikim</small><b class="${proj >= g.amount ? 'pos' : 'neg'}">${fmt(proj)}</b></div>`;
    if (proj >= g.amount) h += `<div class="pos" style="margin-top:8px">Hedefe ulaşırsın, ${fmt(proj - g.amount)} fazlasıyla.</div>`;
    else {
      h += `<div class="neg" style="margin-top:8px">Hedefin ${fmt(g.amount - proj)} altında kalırsın.</div>`;
      if (sv > 0) { const k = Math.ceil(gi.need / sv); h += `<div class="muted">Bu tempoda hedefe ${label(shift(now, k - 1))} ayında ulaşırsın.</div>`; }
    }
  } else {
    h += `<div class="muted" style="margin-top:8px">6 ay sonra: <b>${fmt(g.saved + sv * 6)}</b> · 12 ay sonra: <b>${fmt(g.saved + sv * 12)}</b></div>`;
  }
  out.innerHTML = h;
}

function render() {
  $('#app').innerHTML = { ozet: vOzet, gider: vGider, kart: vKart, varlik: vVarlik, hedef: vHedef }[TAB]();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  if (TAB === 'hedef') sim();
}

document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  TAB = b.dataset.tab; render(); scrollTo(0, 0);
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'prev') { M = shift(M, -1); render(); }
  else if (a === 'next') { M = shift(M, 1); render(); }
  else if (a === 'addExp') {
    const amount = num($('#f-amt').value);
    if (!amount) { $('#f-amt').focus(); return; }
    const date = $('#f-date').value || M + '-01';
    const sv = $('#f-card').value;
    const ex = { id: uid(), desc: $('#f-desc').value.trim(), amount, date, cat: $('#f-cat').value, cardId: sv.startsWith('c:') ? sv.slice(2) : null };
    if (sv.startsWith('a:')) {
      const ast = S.assets.find(x => x.id === sv.slice(2)), q = ast && takeFromAsset(ast, amount);
      if (q == null) { alert('Bu varlıkta yeterli bakiye yok.'); return; }
      ex.assetId = ast.id; ex.assetQty = q;
    }
    ensureM(date.slice(0, 7)).expenses.push(ex);
    persist(); M = date.slice(0, 7); render();
  }
  else if (a === 'delExp') {
    const m = ensureM(M), ex = m.expenses.find(x => x.id === b.dataset.id);
    if (ex && ex.assetId) { const ast = S.assets.find(x => x.id === ex.assetId); if (ast) ast.qty += ex.assetQty; }
    m.expenses = m.expenses.filter(x => x.id !== b.dataset.id); persist(); render();
  }
  else if (a === 'addCard') {
    const name = $('#c-name').value.trim();
    if (!name) { $('#c-name').focus(); return; }
    S.cards.push({ id: uid(), name, limit: num($('#c-limit').value), base: num($('#c-base').value) });
    persist(); render();
  }
  else if (a === 'delCard') {
    if (confirm('Kart silinsin mi? Bu karta bağlı harcamalar kalır ama borca sayılmaz.')) {
      S.cards = S.cards.filter(c => c.id !== b.dataset.id); persist(); render();
    }
  }
  else if (a === 'export') {
    const url = URL.createObjectURL(new Blob([JSON.stringify({ ...S, finnhubKey: '' })], { type: 'application/json' }));
    const l = document.createElement('a'); l.href = url; l.download = 'butce-yedek-' + today() + '.json'; l.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  else if (a === 'import') $('#file').click();
  else if (a === 'addAsset') {
    const T = NEWTYPE, v = id => $('#' + id) ? $('#' + id).value : '';
    const x = { id: uid(), type: T, name: v('a-name').trim(), sym: '', qty: num(v('a-qty')), price: num(v('a-price')), cur: v('a-cur') || 'TRY', at: '' };
    if (T === 'cash') { x.price = 1; x.name = x.name || 'Nakit'; }
    else if (T === 'gold' || T === 'silver') { x.name = T === 'gold' ? 'Altın' : 'Gümüş'; x.cur = 'TRY'; }
    else if (T === 'crypto') { const s = $('#a-coin'); x.sym = s.value; x.name = s.options[s.selectedIndex].text; x.cur = 'TRY'; }
    else if (T === 'other') { x.qty = 1; x.name = x.name || 'Diğer'; }
    else {
      x.name = (x.name || 'Hisse').toUpperCase(); x.sym = x.name;
      x.us = v('a-mkt') === 'us'; if (x.us) x.cur = 'USD';
    }
    if (T === 'other' ? !x.price : !x.qty) { ($('#a-qty') || $('#a-price')).focus(); return; }
    S.assets.push(x); persist(); render();
    if (AUTO[T] || x.us) fetchPrices().then(() => render());
  }
  else if (a === 'payCard') {
    const id = b.dataset.id, amt = num($('#p-amt-' + id).value), sv = $('#p-src-' + id).value, r = rateOf(S.cur.cards);
    if (!amt) { $('#p-amt-' + id).focus(); return; }
    if (!r) { alert('Önce Özet sayfasından kuru gir.'); return; }
    const p = { id: uid(), cardId: id, month: M, date: today().startsWith(M) ? today() : M + '-01', amt, tl: amt * r, src: 'month', qty: 0 };
    if (sv) {
      const ast = S.assets.find(x => x.id === sv.slice(2)), q = ast && takeFromAsset(ast, p.tl);
      if (q == null) { alert('Bu varlıkta yeterli bakiye yok.'); return; }
      p.src = ast.id; p.qty = q;
    }
    S.payments.push(p); persist(); render();
  }
  else if (a === 'delPay') {
    const p = S.payments.find(x => x.id === b.dataset.id);
    if (p) { const ast = S.assets.find(x => x.id === p.src); if (ast) ast.qty += p.qty; S.payments = S.payments.filter(x => x !== p); persist(); render(); }
  }
  else if (a === 'closeMonth') {
    const amt = Math.round(remaining(M) * 100) / 100;
    if (amt < 0 && !confirm('Bu ayın kalanı eksi (' + fmt(amt) + '). Nakit varlıktan düşülecek. Devam?')) return;
    let ast = S.assets.find(x => x.roll);
    if (!ast) { ast = { id: uid(), type: 'cash', name: 'Aylık artan nakit', sym: '', qty: 0, price: 1, cur: 'TRY', at: '', roll: true }; S.assets.push(ast); }
    ast.qty += amt; ensureM(M).closed = { assetId: ast.id, amt }; persist(); render();
  }
  else if (a === 'undoClose') {
    const m = ensureM(M), cl = m.closed;
    if (cl) { const ast = S.assets.find(x => x.id === cl.assetId); if (ast) ast.qty -= cl.amt; delete m.closed; persist(); render(); }
  }
  else if (a === 'goMonth') { M = b.dataset.m; render(); }
  else if (a === 'delAsset') { S.assets = S.assets.filter(x => x.id !== b.dataset.id); persist(); render(); }
  else if (a === 'refreshAll') {
    b.disabled = true; b.textContent = 'Alınıyor…';
    refreshAll().then(errs => { render(); if (errs.length) alert('Alınamadı: ' + errs.join(', ') + '. Fiyatı elle girebilirsin.'); });
  }
  else if (a === 'fetchRates') {
    b.disabled = true; b.textContent = 'Alınıyor…';
    fetchRates().then(() => render()).catch(() => { alert('Kur alınamadı. Elle girebilirsin.'); render(); });
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.months || !d.cards) throw 0;
        if (confirm('Mevcut veriler yedekle değiştirilsin mi?')) { const k = S.finnhubKey; S = Object.assign(def(), d); S.finnhubKey = k; persist(); render(); }
      } catch (_) { alert('Geçersiz yedek dosyası.'); }
    };
    r.readAsText(t.files[0]); return;
  }
  if (t.dataset.set === 'salary') { ensureM(M).salary = t.value.trim() === '' ? null : num(t.value); persist(); render(); }
  else if (t.dataset.cur) { S.cur[t.dataset.cur] = t.value; persist(); render(); }
  else if (t.dataset.rate) { S.rates[t.dataset.rate] = num(t.value); persist(); render(); }
  else if (t.id === 'a-type') { NEWTYPE = t.value; render(); }
  else if (t.dataset.key) { S.finnhubKey = t.value.trim(); persist(); render(); }
  else if (t.dataset.asset) {
    const a = S.assets.find(x => x.id === t.dataset.asset), f = t.dataset.field;
    a[f] = f === 'cur' ? t.value : num(t.value); persist(); render();
  }
  else if (t.dataset.card) {
    const c = S.cards.find(x => x.id === t.dataset.card), f = t.dataset.field;
    c[f] = f === 'name' ? t.value.trim() || c.name : num(t.value); persist(); render();
  }
  else if (t.dataset.goal) {
    const f = t.dataset.goal;
    S.goal[f] = f === 'month' ? t.value : num(t.value); persist(); render();
  }
});

document.addEventListener('input', e => { if (e.target.id === 'simin') sim(); });

function fetchRates() {
  return Promise.all(['USD', 'EUR'].map(c => fetch('https://open.er-api.com/v6/latest/' + c).then(r => r.json()).then(j => {
    if (!j.rates || !j.rates.TRY) throw 0;
    S.rates[c] = Math.round(j.rates.TRY * 100) / 100;
  }))).then(() => { S.rates.at = today(); persist(); });
}

// Altın/gümüş (gold-api.com, ons→gram) ve kripto (CoinGecko) fiyatları. Hisse için ücretsiz, tarayıcıdan çağrılabilir kaynak yok.
async function fetchPrices() {
  const j = async u => { const r = await fetch(u); if (!r.ok) throw 0; return r.json(); };
  const errs = [];
  const metals = S.assets.filter(a => a.type === 'gold' || a.type === 'silver');
  if (metals.length) {
    try {
      const usd = rateOf('USD'); if (!usd) throw 0;
      for (const [t, sym] of [['gold', 'XAU'], ['silver', 'XAG']]) {
        const list = metals.filter(a => a.type === t); if (!list.length) continue;
        const p = (await j('https://api.gold-api.com/price/' + sym)).price;
        list.forEach(a => { a.price = Math.round(p / 31.1035 * usd * 100) / 100; a.cur = 'TRY'; a.at = today(); });
      }
    } catch (e) { errs.push('altın/gümüş'); }
  }
  const coins = S.assets.filter(a => a.type === 'crypto');
  if (coins.length) {
    try {
      const d = await j('https://api.coingecko.com/api/v3/simple/price?vs_currencies=try&ids=' + [...new Set(coins.map(a => a.sym))].join(','));
      coins.forEach(a => { if (d[a.sym] && d[a.sym].try) { a.price = d[a.sym].try; a.cur = 'TRY'; a.at = today(); } });
    } catch (e) { errs.push('kripto'); }
  }
  const stocks = S.assets.filter(a => a.type === 'stock' && a.us);
  if (stocks.length && S.finnhubKey) {
    const bad = [];
    await Promise.all([...new Set(stocks.map(a => a.sym))].map(async sym => {
      try {
        const d = await j('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(sym) + '&token=' + encodeURIComponent(S.finnhubKey));
        if (!d.c) throw 0; // geçersiz sembol 0 döner
        stocks.filter(a => a.sym === sym).forEach(a => { a.price = d.c; a.cur = 'USD'; a.at = today(); });
      } catch (e) { bad.push(sym); }
    }));
    if (bad.length) errs.push('hisse: ' + bad.join(', ') + ' (anahtarı/sembolü kontrol et)');
  }
  S.pricesAt = today(); persist();
  return errs;
}
async function refreshAll() {
  try { await fetchRates(); } catch (e) {}
  return fetchPrices();
}

render();
// Kur ve fiyatlar bugün güncellenmediyse açılışta sessizce yenile; başarısız olursa kayıtlı değerler kalır.
if ((S.rates.at !== today() || S.pricesAt !== today()) && navigator.onLine) {
  refreshAll().then(() => { const el = document.activeElement; if (!el || !/INPUT|SELECT/.test(el.tagName)) render(); });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
